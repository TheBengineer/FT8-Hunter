# Packaged FT8 Hunter for Windows, macOS and Linux (PyInstaller): one file
# that opens the hunter's window (link, QR code, Quit), and a Windows
# installer (FT8-Hunter.iss). A tag v* (v + VERSION in ft8_server.py) also
# makes a GitHub release with the downloads attached, which is where
# installed hunters look for updates.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: FT8-Hunter-windows-x64.zip
          - os: macos-latest
            asset: FT8-Hunter-macos-arm64.zip
          - os: ubuntu-22.04
            asset: FT8-Hunter-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches VERSION (installed hunters compare it)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' ft8_server.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but ft8_server.py says VERSION = $v"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: python -m pip install pyinstaller==6.11.1 qrcode==8.0
      - name: Country file (from WS, with its copyright notice)
        shell: bash
        run: |
          for f in cty.dat cty.dat_copyright.txt; do
            curl -fsSL -o "$f" "https://raw.githubusercontent.com/TheBengineer/ws-hunter/hunter/$f"
          done
      - name: Package
        shell: bash
        run: |
          kind=--onefile
          [ "$RUNNER_OS" = macOS ] && kind=--onedir   # a .app bundle
          win=--windowed
          [ "$RUNNER_OS" = Linux ] && win=
          pyinstaller --noconfirm $kind $win --name FT8-Hunter --hidden-import qrcode \
            --add-data "ft8_app.html:." --add-data "nosleep.min.js:." \
            --add-data "cty.dat:." --add-data "cty.dat_copyright.txt:." ft8_server.py
      - name: Smoke test (serves the page)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe=dist/FT8-Hunter.exe ;;
            macOS) exe=dist/FT8-Hunter.app/Contents/MacOS/FT8-Hunter ;;
            *) exe=dist/FT8-Hunter ;;
          esac
          "$exe" --no-window --http 8181 > smoke.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8181/ -o page.html && break; sleep 1; done
          grep -q "FT8 Hunter" page.html
          curl -fs http://localhost:8181/api/lan
          cat smoke.log
      - name: Window under a virtual display (Linux), screenshot kept
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb imagemagick > /dev/null
          BROWSER=true xvfb-run -s "-screen 0 800x700x24" bash -c '
            dist/FT8-Hunter --window --http 8282 > window.log 2>&1 &
            sleep 8; import -window root window.png; cat window.log'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: window-screenshot
          path: window.png
      - name: Archive
        shell: bash
        run: |
          cp README.md dist/
          cd dist
          case "$RUNNER_OS" in
            Windows) 7z a "../${{ matrix.asset }}" FT8-Hunter.exe README.md > /dev/null ;;
            macOS) ditto -c -k --keepParent FT8-Hunter.app "../${{ matrix.asset }}" ;;
            *) tar czf "../${{ matrix.asset }}" FT8-Hunter README.md ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $ver = (Select-String -Path ft8_server.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -ne "tag") { $ver += "-$($env:GITHUB_SHA.Substring(0,7))" }
          & $iscc /Qp "/DAppVersion=$ver" "/DSrcDir=$PWD\dist" "/DOutDir=$PWD" FT8-Hunter.iss
          if ($LASTEXITCODE) { exit 1 }
          Get-Item FT8-Hunter-windows-x64-setup.exe | Select-Object Name, Length
      - name: "Installer test: silent install, serves the page, uninstall"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\ft8-hunter-test"
          $p = Start-Process .\FT8-Hunter-windows-x64-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode) { throw "setup exit code $($p.ExitCode)" }
          foreach ($f in "FT8-Hunter.exe","README.md","unins000.exe") { if (-not (Test-Path "$dir\$f")) { throw "missing after install: $f" } }
          if (-not (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "FT8 Hunter.lnk")) { throw "no Start menu shortcut" }
          $h = Start-Process "$dir\FT8-Hunter.exe" -ArgumentList "--no-window","--http","8383" -PassThru
          $ok = $false
          foreach ($i in 1..30) { try { $s = Invoke-RestMethod http://localhost:8383/api/state; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "the installed hunter didn't serve its page" }
          "installed hunter: version $($s.update.version), can install updates: $($s.update.can_install)"
          # the one-file exe runs as two processes (a loader and the hunter): stop both
          Get-Process FT8-Hunter -ErrorAction SilentlyContinue | Where-Object Path -like "$dir\*" | Stop-Process -Force
          Start-Sleep 2
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall exit code $($p.ExitCode)" }
          Start-Sleep 3  # the uninstaller finishes from a temporary copy
          if (Test-Path "$dir\FT8-Hunter.exe") { Get-ChildItem $dir; Get-Process FT8-Hunter -ErrorAction SilentlyContinue | Format-Table Id, Path; throw "FT8-Hunter.exe still there after uninstall" }
          "install and uninstall OK"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FT8-Hunter-windows-x64-setup.exe
          path: FT8-Hunter-windows-x64-setup.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: FT8-Hunter-*
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* -R "$GITHUB_REPOSITORY" \
            --title "FT8 Hunter $GITHUB_REF_NAME" --generate-notes
